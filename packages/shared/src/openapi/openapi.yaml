      tags: [auth]
      summary: Change my password (verifies the current one; revokes all refresh sessions).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "200": { description: Changed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /me/activity:
    get:
      tags: [auth]
      summary: My recent portal actions (Profile ▸ My Activity), from the audit log.
      responses:
        "200": { description: Activity }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/activity/screens:
    post:
      tags: [auth]
      summary: >-
        Batch-submit app-area dwell events (parity gap #3). Best-effort usage
        telemetry: the mobile/iPad client posts up to 200 per-screen dwell
        durations for the authenticated member. Idempotent on client_event_id —
        an offline replay of the same batch is a no-op. Malformed rows are
        clamped/skipped server-side rather than rejected. Returns { accepted },
        the number of newly-stored events. Feeds engagement.area_dwell.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [screen, duration_ms, occurred_at, client_event_id]
                    properties:
                      screen: { type: string, maxLength: 40 }
                      duration_ms: { type: integer, minimum: 0, maximum: 86400000 }
                      occurred_at: { type: string, format: date-time }
                      client_event_id: { type: string, format: uuid }
      responses:
        "200":
          description: Accepted count
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

