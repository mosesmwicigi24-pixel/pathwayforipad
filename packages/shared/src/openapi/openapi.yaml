        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Member results }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/members/{id}/password-reset:
    post:
      tags: [portal]
      summary: Admin. Manual password reset — server mints a temporary password, revokes the member's sessions, and returns the plaintext ONCE. Rank-guarded (no peers/higher roles unless SuperAdmin).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Temporary password (returned once, never stored)
          content:
            application/json:
              schema:
                type: object
                required: [temporary_password, full_name]
                properties:
                  temporary_password: { type: string, example: Nuru-Xk4m-Tr8w }
                  full_name: { type: string }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/members/{id}/enrollment:
    patch:
      tags: [portal]
      summary: Admin. Set a member's starting level + entry module (placement). current_level moves to start_level; the §1.9 hard-lock ceiling and advancement gates still apply. Audited.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Enrollment placement updated }
        "400": { description: Validation failed (unknown level or no published module at that position) }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/members/{id}/graduation:
    patch:
      tags: [portal]
      summary: 'Admin. Mark/unmark a member Graduated ({ graduated: boolean }). A lifecycle flag distinct from the server-computed engagement band (§1.1); when set, the member''s list/profile status surfaces as "graduated". Idempotent. Audited.'
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Graduation flag updated }
        "400": { description: Validation failed }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/members/{id}/elevate:
    post:
      tags: [portal]
      summary: Admin. Elevate a member (a Student) into a privileged portal user — sets users.is_staff so they gain admin-console access and appear on System ▸ Users, without a separate registration. Role/permission grants are assigned there. Member-app access unchanged. Idempotent. Audited. (users:create).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Member staff state
          content:
            application/json:
              schema:
                type: object
                required: [user_id, full_name, is_staff, role]
                properties:
                  user_id: { type: string, format: uuid }
                  full_name: { type: string }
                  is_staff: { type: boolean }
                  role: { type: string }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/members/{id}/demote:
    post:
      tags: [portal]
      summary: Admin. Demote a portal-elevated member — clears users.is_staff AND removes every RBAC role assignment + direct permission grant, so they fully lose portal access and drop off System ▸ Users. Membership + member-app access untouched. Idempotent. Audited. (users:create).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Member staff state
          content:
            application/json:
              schema:
                type: object
                required: [user_id, full_name, is_staff, role]
                properties:
                  user_id: { type: string, format: uuid }
                  full_name: { type: string }
                  is_staff: { type: boolean }
                  role: { type: string }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/audit:
    get:
      tags: [portal]
      summary: SuperAdmin. Append-only audit log viewer (actor/action/entity filters).
