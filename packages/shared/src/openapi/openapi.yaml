        "401": { $ref: "#/components/responses/Unauthorized" }

  # --- Webhooks & sync (system) (§3.3) ---
  /webhooks/stripe:
    post:
      tags: [system]
      summary: Stripe event receiver; HMAC-verified + idempotent.
      security: []
      responses:
        "200": { description: Acknowledged }
  /webhooks/mobilemoney/{provider}:
    post:
      tags: [system]
      summary: M-Pesa/Airtel callback receiver; HMAC-verified + idempotent — settlement happens only here.
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [mpesa, airtel] } }
      responses:
        "200": { description: Acknowledged }
  /sync/pull:
    post:
      tags: [system]
      summary: Delta pull — cursors in, changed rows + tombstones + new cursors out.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPullRequest" }
      responses:
        "200":
          description: Delta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPullResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /sync/push:
    post:
      tags: [system]
      summary: Replay the offline mutation queue; per-mutation results.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPushRequest" }
      responses:
        "200":
          description: Per-mutation results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPushResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --- Radio Broadcast Studio + Virtual Audio Mixer (docs/RADIO_STUDIO_CONTRACT.md) ---
  # Admin surface (/admin/radio/*, RBAC radio:*) returns RadioProgram WITH ingest
  # secrets; the member surface (/radio/*, auth) returns RadioProgramPublic, which
  # OMITS stream_key/ingest_url/ingest_provider. Private programs are never member-visible.
  /admin/radio/programs:
    get:
      tags: [radio]
      summary: List all programs (admin). Includes ingest secrets. Gated by radio:view.
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [draft, scheduled, live, ended] } }
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RadioProgram" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
    post:
      tags: [radio]
      summary: Create a program; provisions ingest credentials. Gated by radio:create.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRadioProgramBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioProgram" }
        "400": { description: Validation failed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /admin/radio/programs/{id}:
    get:
      tags: [radio]
      summary: Get a program (admin, incl. secrets). Gated by radio:view.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Program
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioProgram" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [radio]
      summary: Update a program. Gated by radio:edit.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRadioProgramBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioProgram" }
        "400": { description: Validation failed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [radio]
      summary: Delete a program. Gated by radio:delete.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/radio/programs/{id}/reactions:
    get:
      tags: [radio]
      summary: Aggregate reaction totals for a program (all members) — heart/amen/fire counts for the console's interactions panel. Gated by radio:view.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Totals
          content:
            application/json:
              schema:
                type: object
                required: [heart, amen, fire]
                properties:
                  heart: { type: integer }
                  amen: { type: integer }
                  fire: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/radio/programs/{id}/go-live:
    post:
      tags: [radio]
      summary: Go live — status=live, is_live=true; provider.start. Gated by radio:edit. Only ONE session can be on air — 409 (with live_program_id/title in details) while another is live; the auto-air sweep retries, so a scheduled session starts automatically when the current one ends.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Now live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioProgram" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Another session is already live (details carry live_program_id + live_program_title) }
  /admin/radio/mic-bridge:
    get:
      tags: [radio]
      summary: "WebSocket upgrade (not plain HTTP): browser mic broadcasting. The console captures the mic (getUserMedia → MediaRecorder) and streams encoded chunks (binary frames) here; the server performs the Icecast SOURCE handshake against the liquidsoap harbor /mic input and pipes bytes through. Auth: ?token=<access JWT> (WS can't set headers) + radio:edit. ?ct= declares the encoding (audio/webm default; audio/mp4 for Safari). First server frame after the harbor accepts is {ok:true,mount}. Close codes: 4001 bad token · 4003 no permission · 4004 not configured · 4008 engine unreachable/no live session · 4409 mic input busy (someone already on mic)."
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string }, description: Access JWT (header auth is unavailable on WebSocket upgrades) }
        - { name: ct, in: query, required: false, schema: { type: string, enum: [audio/webm, audio/mp4, audio/aac, audio/mpeg, audio/ogg] } }
      responses:
        "101": { description: Switching Protocols — WebSocket session established }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/radio/schedule/conflicts:
    get:
      tags: [radio]
      summary: Pre-save overlap check for a proposed schedule slot — other scheduled sessions (and a live one's projected window) that intersect [scheduled_at, scheduled_at + duration_min). Sessions without a duration are assumed 60 min. Gated by radio:view.
      parameters:
        - { name: scheduled_at, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: duration_min, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1440 } }
        - { name: exclude_id, in: query, required: false, schema: { type: string, format: uuid }, description: The program being edited (excluded from its own check) }
      responses:
        "200":
          description: Overlapping sessions (empty = the slot is clear)
          content:
            application/json:
              schema:
                type: object
                required: [conflicts]
                properties:
                  conflicts:
                    type: array
                    items:
                      type: object
                      required: [id, title, status, is_live]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        scheduled_at: { type: [string, "null"], format: date-time }
                        duration_min: { type: [integer, "null"] }
                        status: { type: string, enum: [draft, scheduled, live, ended] }
                        is_live: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /admin/radio/programs/{id}/end:
    post:
      tags: [radio]
      summary: End — status=ended, is_live=false; provider.stop. Gated by radio:edit.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioProgram" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/radio/programs/{id}/rotate-key:
    post:
      tags: [radio]
      summary: Rotate the secret stream key. Gated by radio:edit.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: New stream key
          content:
            application/json:
              schema:
                type: object
                required: [stream_key]
                properties: { stream_key: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/radio/programs/{id}/health:
    get:
      tags: [radio]
      summary: Live stream health (live programs only). Gated by radio:view.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamHealth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/radio/programs/{id}/comments:
    get:
      tags: [radio]
      summary: All comments incl. hidden (moderation). Gated by radio:view.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RadioComment" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/radio/comments/{cid}:
    delete:
      tags: [radio]
      summary: Hide a comment (moderation). Gated by radio:edit.
      parameters: [{ name: cid, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Hidden, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- Radio audio library (tracks) + session playlists ---
  /admin/radio/tracks:
    get:
      tags: [radio]
      summary: List audio-library tracks, newest first (optional kind filter). Gated by radio:view.
      parameters:
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [music, preaching, audio] }
      responses:
        "200":
          description: Tracks
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RadioTrack" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
    post:
      tags: [radio]
      summary: Create an audio-library track (audio_url from the audio upload). Gated by radio:create.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRadioTrackBody" }
      responses:
        "201":
          description: Track
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioTrack" }
        "400": { description: Validation failed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /admin/radio/tracks/{id}:
    delete:
      tags: [radio]
      summary: Delete a track; cascades it out of all playlists. Gated by radio:delete.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/radio/programs/{id}/tracks:
    get:
      tags: [radio]
      summary: Ordered session playlist (embedded tracks). Gated by radio:view.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Playlist items
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RadioPlaylistItem" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [radio]
      summary: Append a track to the playlist at the next position. Gated by radio:edit.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddPlaylistItemBody" }
      responses:
        "201":
          description: Playlist item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioPlaylistItem" }
        "400": { description: Validation failed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/radio/programs/{id}/tracks/order:
    put:
      tags: [radio]
      summary: Reorder the full playlist by item ids (must match the program's items). Gated by radio:edit.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReorderPlaylistBody" }
      responses:
        "200": { description: Reordered, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "400": { description: Validation failed / item_ids mismatch }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/radio/programs/{id}/tracks/{itemId}:
    delete:
      tags: [radio]
      summary: Remove a playlist item; remaining positions re-normalize to 1..n. Gated by radio:edit.
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Removed, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/radio/mixer/scenes:
    get:
      tags: [radio]
      summary: List mixer scene presets. Gated by radio:view.
      responses:
        "200":
          description: Scenes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MixerScene" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
    post:
      tags: [radio]
      summary: Create a mixer scene. Gated by radio:create.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MixerSceneBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MixerScene" }
        "400": { description: Validation failed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /admin/radio/mixer/scenes/{id}:
    patch:
      tags: [radio]
      summary: Update a mixer scene. Gated by radio:edit.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MixerSceneBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MixerScene" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [radio]
      summary: Delete a mixer scene. Gated by radio:delete.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/radio/mixer/jingles:
    get:
      tags: [radio]
      summary: List jingle soundboard entries. Gated by radio:view.
      responses:
        "200":
          description: Jingles
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MixerJingle" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
    post:
      tags: [radio]
      summary: Create a jingle. Gated by radio:create.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MixerJingleBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MixerJingle" }
        "400": { description: Validation failed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /admin/radio/mixer/jingles/{id}:
    delete:
      tags: [radio]
      summary: Delete a jingle. Gated by radio:delete.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- LIVE MIX control (liquidsoap engine on the VPS; telnet control server) ---
  /admin/radio/mixer/live/levels:
    post:
      tags: [radio]
      summary: Set live-mix channel gains (mic/bed/jingle/master, ints 0..100). Gated by radio:edit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MixerLiveLevelsBody" }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "400": { description: Validation failed (at least one channel required) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "503": { description: Live mix engine not configured or unreachable }
  /admin/radio/mixer/live/eq:
    post:
      tags: [radio]
      summary: Set live-mix 3-band EQ gains per bus (mic/bed/master × low/mid/high, dB −12..+12). Gated by radio:edit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MixerLiveEqBody" }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "400": { description: Validation failed (at least one band gain required; dB −12..+12) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "503": { description: Live mix engine not configured or unreachable }
  /admin/radio/mixer/live/jingle:
    post:
      tags: [radio]
      summary: Fire a jingle on the live mix (server-hosted /media/ audio only). Gated by radio:edit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MixerLiveJingleBody" }
      responses:
        "200": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: Jingle has no server-hosted audio — re-upload it }
        "503": { description: Live mix engine not configured or unreachable }
  /admin/radio/mixer/live/scene:
    post:
      tags: [radio]
      summary: Apply a saved mixer scene to the live mix (mic→mic, music→bed, jingle→jingle, master→master; other channels ignored). Gated by radio:edit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MixerLiveSceneBody" }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MixerLiveSceneApplied" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Live mix engine not configured or unreachable }
  /admin/radio/mixer/live/status:
    get:
      tags: [radio]
      summary: Live mix engine status — never 503s (a down engine reads connected=false). Gated by radio:view.
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MixerLiveStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }

  # --- Radio member surface (auth only; public projection, no ingest secrets) ---
  /radio/programs:
    get:
      tags: [radio]
      summary: Visible programs (public always; members if authed; never private).
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RadioProgramPublic" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /radio/now-playing:
    get:
      tags: [radio]
      summary: Current live program, or the next scheduled one (null if none). No stream_key.
      responses:
        "200":
          description: Now playing (or null)
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/RadioProgramPublic" }
                  - { type: "null" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /radio/programs/{id}:
    get:
      tags: [radio]
      summary: Program public view (hls_url yes, stream_key NO). 404 for private.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Program (public projection)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioProgramPublic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /radio/programs/{id}/listening:
    post:
      tags: [radio]
      summary: >-
        Listener presence heartbeat. The member player POSTs this ~every 20s
        while it is actually playing this live program; idempotent upsert of the
        caller's (program,user,last_seen=now). Stops when playback stops.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Heartbeat recorded
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties: { ok: { type: boolean, enum: [true] } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /radio/programs/{id}/listeners:
    get:
      tags: [radio]
      summary: >-
        Live listener roster — real members active within the last 45s (most
        recent first, capped at 100) plus the real active count. Drives the
        studio's Live listeners panel and count.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Active listener roster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioListenerRoster" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /radio/programs/{id}/react:
    post:
      tags: [radio]
      summary: React (heart|amen|fire). Idempotent per client_event_id (§2.1/§3.6).
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RadioReactBody" }
      responses:
        "200":
          description: Reaction counts
          content:
            application/json:
              schema:
                type: object
                required: [counts]
                properties: { counts: { $ref: "#/components/schemas/RadioReactionCounts" } }
        "400": { description: Validation failed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /radio/programs/{id}/comments:
    get:
      tags: [radio]
      summary: Non-hidden comments, newest first.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RadioComment" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [radio]
      summary: Post a comment. Idempotent per client_event_id (§2.1/§3.6).
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RadioCommentBody" }
      responses:
        "201":
          description: Comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioComment" }
        "400": { description: Validation failed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, maximum: 200 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    Conflict:
      description: Optimistic-concurrency clash; current value returned.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    GateLocked:
      description: Content or action blocked by the gating engine.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ForbiddenScope:
      description: Authenticated but not authorised for this resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid, or expired credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Well-formed but semantically invalid (e.g. unknown cell group).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpstreamUnavailable:
      description: A required dependency (e.g. the IdP) is unreachable or not configured.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Permission:
      type: object
      description: A single RBAC (module × capability) cell. 16 fixed modules × 6 capabilities.
      required: [module_id, capability]
      properties:
        module_id:
          type: string
          enum: [dashboard, levels, cms, quiz, videos, cells, members, reflections, events, finance, certificates, badges, users, rolesAdmin, countries, languages, congregations]
        capability:
          type: string
          enum: [view, create, edit, delete, approve, export]
    HubScores:
      type: object
      description: Growth scores, 0–100 ints; null if not yet computed.
      required: [overall, word, prayer, habits, curriculum, attendance]
      properties:
        overall: { type: [integer, "null"] }
        word: { type: [integer, "null"] }
        prayer: { type: [integer, "null"] }
        habits: { type: [integer, "null"] }
        curriculum: { type: [integer, "null"] }
        attendance: { type: [integer, "null"] }
    MyDiscipleship:
      type: object
      required: [discipler, dm_conversation_id, can_message, progression, scores, reflections, next_meeting_at, notes]
      properties:
        discipler:
          type: [object, "null"]
          required: [user_id, full_name, avatar_url, role_label, cell_name, established_at]
          properties:
            user_id: { type: string, format: uuid }
            full_name: { type: string }
            avatar_url: { type: [string, "null"] }
            role_label: { type: string, enum: [Cell Leader, Discipler] }
            cell_name: { type: [string, "null"] }
            established_at: { type: [string, "null"], format: date-time }
        dm_conversation_id:
          type: [string, "null"]
          format: uuid
          description: Present only if a DM already exists; a GET never creates one.
        can_message: { type: boolean, description: false for minors (chat blocks minors). }
        progression:
          type: object
          required: [current_level, level_title, streak_days, modules_completed, modules_total, awaiting_review, awaiting_level]
          properties:
            current_level: { type: integer }
            level_title: { type: string }
            streak_days: { type: integer }
            modules_completed: { type: integer }
            modules_total: { type: integer }
            awaiting_review: { type: boolean }
            awaiting_level: { type: [integer, "null"] }
        scores: { $ref: "#/components/schemas/HubScores" }
        reflections:
          type: array
          description: The member's own reflections, most-recent first, cap 20. Never exposes pastoral_note.
          items:
            type: object
            required: [module_id, module_title, level_number, state, submitted_at, feedback_notes]
            properties:
              module_id: { type: string, format: uuid }
              module_title: { type: string }
              level_number: { type: integer }
              state: { type: string, enum: [approved, pending, returned, deferred] }
              submitted_at: { type: string, format: date-time }
              feedback_notes: { type: [string, "null"] }
        next_meeting_at: { type: [string, "null"], format: date-time }
        notes:
          type: array
          items:
            type: object
            required: [topic, body, met_at, next_meeting_at]
            properties:
              topic: { type: string }
              body: { type: string }
              met_at: { type: string, format: date-time }
              next_meeting_at: { type: [string, "null"], format: date-time }
    DiscipleRosterRow:
      type: object
      required: [user_id, full_name, avatar_url, cell_name, cell_group_id, current_level, band, streak_days, days_since_last_activity, pending_reflections, awaiting_level]
      properties:
        user_id: { type: string, format: uuid }
        full_name: { type: string }
        avatar_url: { type: [string, "null"] }
        cell_name: { type: [string, "null"] }
        cell_group_id: { type: [string, "null"], format: uuid }
        current_level: { type: integer }
        band: { type: [string, "null"], enum: [thriving, steady, watch, at_risk, null] }
        streak_days: { type: integer }
        days_since_last_activity: { type: [integer, "null"] }
        pending_reflections: { type: integer }
        awaiting_level: { type: [integer, "null"] }
    DiscipleDossier:
      type: object
      required: [member, progression, scores, engagement, reflections, recent_activity, dm_conversation_id]
      properties:
        member:
          type: object
          required: [user_id, full_name, avatar_url, cell_name, established_at, joined_at]
          properties:
            user_id: { type: string, format: uuid }
            full_name: { type: string }
            avatar_url: { type: [string, "null"] }
            cell_name: { type: [string, "null"] }
            established_at: { type: [string, "null"], format: date-time }
            joined_at: { type: [string, "null"], format: date-time }
        progression:
          type: object
          required: [current_level, level_title, streak_days, modules_completed, modules_total, awaiting_level]
          properties:
            current_level: { type: integer }
            level_title: { type: string }
            streak_days: { type: integer }
            modules_completed: { type: integer }
            modules_total: { type: integer }
            awaiting_level: { type: [integer, "null"] }
        scores: { $ref: "#/components/schemas/HubScores" }
        engagement:
          type: object
          required: [e_score, band, days_since_last_activity]
          properties:
            e_score: { type: [integer, "null"], description: 0–100 (engagement Eᵢ ×100). }
            band: { type: [string, "null"], enum: [thriving, steady, watch, at_risk, null] }
            days_since_last_activity: { type: [integer, "null"] }
        reflections:
          type: array
          description: Discipler DOES see body + feedback_notes (pastoral). Most-recent first, cap 20.
          items:
            type: object
            required: [reflection_id, module_id, module_title, level_number, state, submitted_at, body, feedback_notes]
            properties:
              reflection_id: { type: string, format: uuid }
              module_id: { type: string, format: uuid }
              module_title: { type: string }
              level_number: { type: integer }
              state: { type: string, enum: [approved, pending, returned, deferred] }
              submitted_at: { type: string, format: date-time }
              body: { type: string }
              feedback_notes: { type: [string, "null"] }
        recent_activity:
          type: array
          description: Last ~20 interaction_events.
          items:
            type: object
            required: [kind, occurred_at]
            properties:
              kind: { type: string }
              occurred_at: { type: string, format: date-time }
        dm_conversation_id: { type: [string, "null"], format: uuid }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            details: { type: object, additionalProperties: true }

    Ok:
      type: object
      required: [ok]
      properties: { ok: { type: boolean, enum: [true] } }

    # --- Radio Broadcast Studio + Virtual Audio Mixer ---
    RadioProgram:
      type: object
      required:
        [id, title, category, tags, visibility, status, is_live, record_broadcast,
         peak_listeners, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, "null"] }
        category: { type: string, enum: [Sermon, Worship, Prayer, "Bible Study", Conference] }
        speaker: { type: [string, "null"] }
        location: { type: [string, "null"] }
        artwork_url: { type: [string, "null"] }
        tags: { type: array, items: { type: string } }
        visibility: { type: string, enum: [public, members, private] }
        scheduled_at: { type: [string, "null"], format: date-time }
        duration_min: { type: [integer, "null"] }
        repeat: { type: [string, "null"] }
        timezone: { type: [string, "null"] }
        status: { type: string, enum: [draft, scheduled, live, ended] }
        loop_mode: { type: string, enum: [none, loop_all, repeat_one] }
        is_live: { type: boolean }
        live_started_at: { type: [string, "null"], format: date-time }
        live_ended_at: { type: [string, "null"], format: date-time }
        audio_url: { type: [string, "null"] }
        audio_duration_sec: { type: [integer, "null"] }
        auto_go_live: { type: boolean }
        record_broadcast: { type: boolean }
        record_target: { type: [string, "null"], enum: [cloud, local, both, null] }
        peak_listeners: { type: integer }
        ingest_provider: { type: [string, "null"] }
        ingest_url: { type: [string, "null"] }
        stream_key: { type: [string, "null"], description: "SECRET — admin surface only, never returned to members" }
        hls_url: { type: [string, "null"] }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RadioProgramPublic:
      type: object
      description: Member/public projection — OMITS stream_key, ingest_url, ingest_provider.
      required:
        [id, title, category, tags, visibility, status, is_live, record_broadcast,
         peak_listeners, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, "null"] }
        category: { type: string, enum: [Sermon, Worship, Prayer, "Bible Study", Conference] }
        speaker: { type: [string, "null"] }
        location: { type: [string, "null"] }
        artwork_url: { type: [string, "null"] }
        tags: { type: array, items: { type: string } }
        visibility: { type: string, enum: [public, members, private] }
        scheduled_at: { type: [string, "null"], format: date-time }
        duration_min: { type: [integer, "null"] }
        repeat: { type: [string, "null"] }
        timezone: { type: [string, "null"] }
        status: { type: string, enum: [draft, scheduled, live, ended] }
        loop_mode: { type: string, enum: [none, loop_all, repeat_one] }
        is_live: { type: boolean }
        live_started_at: { type: [string, "null"], format: date-time }
        live_ended_at: { type: [string, "null"], format: date-time }
        audio_url: { type: [string, "null"] }
        audio_duration_sec: { type: [integer, "null"] }
        auto_go_live: { type: boolean }
        record_broadcast: { type: boolean }
        record_target: { type: [string, "null"], enum: [cloud, local, both, null] }
        peak_listeners: { type: integer }
        hls_url: { type: [string, "null"] }
        tracks:
          type: array
          description: Ordered session playlist (populated on detail/now-playing reads).
          items: { $ref: "#/components/schemas/RadioPlaylistItem" }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RadioTrack:
      type: object
      description: A reusable audio-library asset. Members DO get audio_url.
      required: [id, title, kind, audio_url, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        kind: { type: string, enum: [music, preaching, audio] }
        audio_url: { type: string }
        duration_sec: { type: [integer, "null"] }
        size_bytes: { type: [integer, "null"] }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
    RadioPlaylistItem:
      type: object
      description: One ordered slot in a session playlist, embedding its track.
      required: [id, position, track]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer }
        track: { $ref: "#/components/schemas/RadioTrack" }
    CreateRadioTrackBody:
      type: object
      required: [title, kind, audio_url]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        kind: { type: string, enum: [music, preaching, audio] }
        audio_url: { type: string, minLength: 1, maxLength: 2000 }
        duration_sec: { type: integer, minimum: 1 }
        size_bytes: { type: integer, minimum: 0 }
    AddPlaylistItemBody:
      type: object
      required: [track_id]
      properties:
        track_id: { type: string, format: uuid }
    ReorderPlaylistBody:
      type: object
      required: [item_ids]
      properties:
        item_ids: { type: array, minItems: 1, items: { type: string, format: uuid } }
    CreateRadioProgramBody:
      type: object
      required: [title, category]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 4000 }
        category: { type: string, enum: [Sermon, Worship, Prayer, "Bible Study", Conference] }
        speaker: { type: string, maxLength: 200 }
        location: { type: string, maxLength: 200 }
        artwork_url: { type: string, maxLength: 2000 }
        tags: { type: array, items: { type: string, maxLength: 60 }, maxItems: 30 }
        visibility: { type: string, enum: [public, members, private] }
        scheduled_at: { type: string, format: date-time }
        duration_min: { type: integer, minimum: 1, maximum: 1440 }
        repeat: { type: string, maxLength: 30 }
        timezone: { type: string, maxLength: 60 }
        loop_mode: { type: string, enum: [none, loop_all, repeat_one] }
        audio_url: { type: string, maxLength: 2000 }
        audio_duration_sec: { type: integer, minimum: 1 }
        auto_go_live: { type: boolean }
        record_broadcast: { type: boolean }
        record_target: { type: string, enum: [cloud, local, both] }
    UpdateRadioProgramBody:
      allOf:
        - { $ref: "#/components/schemas/CreateRadioProgramBody" }
        - type: object
          properties:
            status: { type: string, enum: [draft, scheduled, live, ended] }
    AudioUploadResult:
      type: object
      description: Bare result of POST /admin/media/audio/upload (no media_assets row).
      required: [url, duration_sec]
      properties:
        url: { type: string }
        duration_sec: { type: [integer, "null"] }
    RadioReactionCounts:
      type: object
      required: [heart, amen, fire]
      properties:
        heart: { type: integer }
        amen: { type: integer }
        fire: { type: integer }
    RadioReactBody:
      type: object
      required: [kind, client_event_id]
      properties:
        kind: { type: string, enum: [heart, amen, fire] }
        client_event_id: { type: string, minLength: 1, maxLength: 200 }
    RadioComment:
      type: object
      required: [id, program_id, member_id, body, hidden, created_at]
      properties:
        id: { type: string, format: uuid }
        program_id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        body: { type: string }
        hidden: { type: boolean }
        client_event_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        author_name: { type: [string, "null"], description: "Comment author's display name (users join)" }
        author_avatar_url: { type: [string, "null"] }
    RadioCommentBody:
      type: object
      required: [body, client_event_id]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
        client_event_id: { type: string, minLength: 1, maxLength: 200 }
    RadioListener:
      type: object
      required: [user_id, name, avatar_url]
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string, description: "Listener's display name (users join)" }
        avatar_url: { type: [string, "null"] }
    RadioListenerRoster:
      type: object
      required: [count, listeners]
      properties:
        count: { type: integer, description: "Real active listeners within the last 45s" }
        listeners:
          type: array
          items: { $ref: "#/components/schemas/RadioListener" }
    StreamHealth:
      type: object
      required: [cpu, memory, bitrate, latency, dropped, stability, listeners]
      properties:
        cpu: { type: number }
        memory: { type: number }
        bitrate: { type: number }
        latency: { type: number }
        dropped: { type: number }
        stability: { type: number }
        listeners: { type: number }
    MixerChannel:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        sub: { type: string }
        color: { type: string }
        level: { type: number }
        pan: { type: number }
        muted: { type: boolean }
        solo: { type: boolean }
    MixerScene:
      type: object
      required: [id, name, channels, is_default, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        hint: { type: [string, "null"] }
        channels: { type: array, items: { $ref: "#/components/schemas/MixerChannel" } }
        is_default: { type: boolean }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MixerSceneBody:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        hint: { type: string, maxLength: 300 }
        channels: { type: array, items: { $ref: "#/components/schemas/MixerChannel" }, maxItems: 64 }
        is_default: { type: boolean }
    MixerJingle:
      type: object
      required: [id, label, sort, created_at]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        color: { type: [string, "null"] }
        audio_url: { type: [string, "null"] }
        sort: { type: integer }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
    MixerJingleBody:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }
        color: { type: string, maxLength: 40 }
        audio_url: { type: string, maxLength: 2000 }
        sort: { type: integer }
    MixerLiveLevelsBody:
      type: object
      required: [channels]
      description: Live-mix gains as ints 0..100 (converted to 0..1 on the engine wire). At least one channel.
      properties:
        channels:
          type: object
          minProperties: 1
          properties:
            mic: { type: integer, minimum: 0, maximum: 100 }
            bed: { type: integer, minimum: 0, maximum: 100 }
            jingle: { type: integer, minimum: 0, maximum: 100 }
            master: { type: integer, minimum: 0, maximum: 100 }
    MixerEqBandGains:
      type: object
      description: One bus's 3-band peaking-EQ gains in dB (−12..+12, default 0).
      properties:
        low: { type: number, minimum: -12, maximum: 12 }
        mid: { type: number, minimum: -12, maximum: 12 }
        high: { type: number, minimum: -12, maximum: 12 }
    MixerLiveEqBody:
      type: object
      required: [bands]
      description: Per-bus 3-band EQ gains in dB. At least one band gain overall (engine keys eq_<bus>_<band>).
      properties:
        bands:
          type: object
          minProperties: 1
          properties:
            mic: { $ref: "#/components/schemas/MixerEqBandGains" }
            bed: { $ref: "#/components/schemas/MixerEqBandGains" }
            master: { $ref: "#/components/schemas/MixerEqBandGains" }
    MixerLiveJingleBody:
      type: object
      required: [jingle_id]
      properties:
        jingle_id: { type: string, format: uuid }
    MixerLiveSceneBody:
      type: object
      required: [scene_id]
      properties:
        scene_id: { type: string, format: uuid }
    MixerLiveSceneApplied:
      type: object
      required: [ok, applied]
      properties:
        ok: { type: boolean, enum: [true] }
        applied:
          type: object
          description: The live gains that were set (scene channels mapped mic→mic, music→bed, jingle→jingle, master→master).
          additionalProperties: { type: integer, minimum: 0, maximum: 100 }
    MixerLiveStatus:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean }
        gains:
          type: object
          description: Present when connected — current gains per channel, ints 0..100.
          additionalProperties: { type: number }

    # --- Auth & identity (§3.3, §5.3) ---
    ModuleEngagement:
      type: object
      required: [reading_seconds, audio_seconds, video_seconds, last_page]
      description: Accumulated per-(member, module) engagement totals from reader heartbeats.
      properties:
        reading_seconds: { type: integer, minimum: 0 }
        audio_seconds: { type: integer, minimum: 0 }
        video_seconds: { type: integer, minimum: 0 }
        last_page: { type: integer, minimum: 1 }
    ModuleBody:
      type: object
      description: >-
        Member-facing full module read (§3.3). Lesson media is brokered to signed,
        expiring URLs (raw storage refs never leak, §4.5); durations are whole
        seconds for the reader's "watch X min / listen Y min" labels. content_pages
        is derived (lesson_content split on <!-- page-break --> markers; one page
        when none). FIXED wire contract consumed by the iOS build.
      properties:
        module_id: { type: string, format: uuid }
        level_number: { type: integer, minimum: 1 }
        module_sequence_number: { type: integer, minimum: 1 }
        title: { type: string }
        summary: { type: [string, "null"] }
        lesson_content: { type: string }
        content_pages:
          type: array
          items: { type: string }
          description: Server-authored reader pages (page-break split; one page when no markers).
        key_verses: { type: [array, "null"], items: { type: string } }
        evaluation_kind: { type: string }
        estimated_minutes: { type: [integer, "null"], minimum: 0 }
        video_url:
          type: [string, "null"]
          description: Signed, expiring lesson video URL (brokered; null when unset).
        video_duration_sec:
          type: [integer, "null"]
          minimum: 0
          description: Lesson video length in whole seconds (null when unset).
        audio_url:
          type: [string, "null"]
          description: Signed, expiring lesson audio URL (admin-controlled, brokered; null when unset).
        audio_duration_sec:
          type: [integer, "null"]
          minimum: 0
          description: Lesson audio length in whole seconds (null when unset).
        quiz_pass_mark: { type: number }
        current_version: { type: integer, minimum: 1 }
        locked: { type: boolean, description: Always false on this read (gated 409 otherwise). }
    ModuleUpdate:
      type: object
      description: >-
        Admin module edit (§3.3). All fields optional; a lesson_content change
        versions the module. Media durations are whole seconds; audio_url is the
        admin-controlled lesson audio (brokered to members). Nullable fields accept
        null to clear.
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        summary: { type: [string, "null"] }
        lesson_content: { type: string, minLength: 1 }
        evaluation_kind: { type: string }
        quiz_pass_mark: { type: number, minimum: 0, maximum: 100 }
        estimated_minutes: { type: [integer, "null"], minimum: 0 }
        video_url: { type: [string, "null"], format: uri, maxLength: 512 }
        video_duration_sec:
          type: [integer, "null"]
          minimum: 0
          description: Lesson video length in whole seconds (null to clear).
        audio_url:
          type: [string, "null"]
          format: uri
          maxLength: 512
          description: Admin-controlled lesson audio URL (null to clear).
        audio_duration_sec:
          type: [integer, "null"]
          minimum: 0
          description: Lesson audio length in whole seconds (null to clear).
        media_asset_id: { type: [string, "null"], format: uuid }
        key_verses: { type: [array, "null"], items: { type: string } }
        expected_row_version: { type: integer, minimum: 1, description: Optimistic-concurrency guard (§5.8). }
    OAuthExchange:
      type: object
      required: [code]
      description: Server-side authorization-code exchange inputs (§5.3).
      properties:
        code: { type: string, minLength: 1 }
        redirect_uri: { type: string, format: uri }
        code_verifier: { type: string, minLength: 1, description: PKCE verifier }
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string, description: Short-lived (15-min) access JWT }
        refresh_token: { type: string, description: Rotating refresh token (returned once) }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Access-token lifetime in seconds }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string, minLength: 1 }
    MeProfile:
      type: object
      required: [profile]
      properties:
        profile:
          type: object
          required: [user_id, full_name, role, congregation_id, row_version]
          properties:
            user_id: { type: string, format: uuid }
            email: { type: [string, "null"] }
            full_name: { type: string }
            phone_number: { type: [string, "null"] }
            date_of_birth: { type: [string, "null"], format: date }
            year_of_salvation: { type: [integer, "null"] }
            is_baptized: { type: boolean }
            cell_group_id: { type: [string, "null"], format: uuid }
            congregation_id: { type: [string, "null"], format: uuid }
            role: { type: string, enum: [Student, Instructor, Admin, SuperAdmin] }
            timezone: { type: string }
            locale: { type: string }
            is_minor: { type: boolean }
            mfa_enabled: { type: boolean, description: Whether the member has 2FA turned on }
            row_version: { type: integer }
        enrollment:
          type: [object, "null"]
          properties:
            enrollment_id: { type: string, format: uuid }
            current_level: { type: integer }
            state: { type: string, enum: [active, paused, completed, withdrawn] }
            started_at: { type: string, format: date-time }
    ProfileUpdate:
      type: object
      required: [row_version]
      description: Mutable fields only; role/congregation/email are not self-writable (§5.4, §5.8).
      properties:
        full_name: { type: string, minLength: 1, maxLength: 255 }
        phone_number: { type: string, minLength: 3, maxLength: 32 }
        cell_group_id: { type: [string, "null"], format: uuid }
        timezone: { type: string, maxLength: 64 }
        locale: { type: string, maxLength: 12 }
        gender: { type: [string, "null"], enum: [male, female, prefer_not_to_say, null] }
        city: { type: [string, "null"], maxLength: 120 }
        country_code: { type: [string, "null"], minLength: 2, maxLength: 2 }
        date_of_birth: { type: [string, "null"], format: date }
        socials: { type: object, additionalProperties: { type: string } }
        row_version: { type: integer, description: Expected version for optimistic concurrency }
    OnboardingIntake:
      type: object
      required: [date_of_birth, phone_number, cell_group_id]
      properties:
        date_of_birth: { type: string, format: date }
        phone_number: { type: string, minLength: 3, maxLength: 32 }
        cell_group_id: { type: string, format: uuid }
        year_of_salvation: { type: integer, minimum: 1900, maximum: 2100 }
        is_baptized: { type: boolean, default: false }
        timezone: { type: string, maxLength: 64 }
    DeviceRegister:
      type: object
      required: [platform]
      properties:
        platform: { type: string, enum: [ios, android] }
        app_version: { type: string, maxLength: 20 }
        model: { type: string, maxLength: 80, description: "Optional device model (e.g. \"iPhone 17 Pro Max\"); trimmed, omitted by older clients." }
        push_token: { type: string, maxLength: 512 }
    MfaEnroll:
      type: object
      required: [otpauth_uri, secret]
      properties:
        otpauth_uri: { type: string, description: otpauth:// URI for QR provisioning }
        secret: { type: string, description: base32 TOTP secret (shown once for manual entry) }
    MfaVerify:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6,10}$" }
    MfaElevation:
      type: object
      required: [access_token, token_type, expires_in, mfa_enabled]
      properties:
        access_token: { type: string, description: Access token carrying the verified mfa claim }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
        mfa_enabled: { type: boolean }
        recovery_codes:
          type: array
          items: { type: string }
          description: One-time recovery codes, returned ONCE on the call that first enables 2FA.
    MfaChallenge:
      type: object
      required: [mfa_required, mfa_token]
      description: Returned by /auth/login when the account has 2FA on — exchange via /auth/login/mfa.
      properties:
        mfa_required: { type: boolean, enum: [true] }
        mfa_token: { type: string, description: Short-lived (5-min) challenge token }
    LoginResult:
      oneOf:
        - $ref: "#/components/schemas/TokenPair"
        - $ref: "#/components/schemas/MfaChallenge"
    MfaLoginComplete:
      type: object
      required: [mfa_token, code]
      properties:
        mfa_token: { type: string }
        code: { type: string, description: A 6–10 digit TOTP code or a recovery code }
    MfaDisable:
      type: object
      required: [code]
      properties:
        code: { type: string, description: A current TOTP code or a recovery code }

    GivingIntentRequest:
      type: object
      required: [fund, amount_minor, currency]
      properties:
        fund: { type: string, description: "Fund code from the funds table (tithe, offering, general, media, mission, gift, …)" }
        amount_minor: { type: integer, format: int64, description: "Minor units, never floats" }
        currency: { type: string, minLength: 3, maxLength: 3 }
        method: { type: string, enum: [card, mpesa, airtel], default: card }
        phone_number: { type: string, description: "Mobile money only — where the STK push lands; defaults to the profile phone" }
        idempotency_key: { type: string, minLength: 8, maxLength: 255, description: Client-supplied; replays return the same transaction }
    GivingIntentResult:
      type: object
      required: [transaction_id, status, idempotency_key, reused]
      properties:
        transaction_id: { type: string, format: uuid }
        client_secret: { type: string, description: Stripe PaymentIntent client secret (card method only; absent on a reused intent) }
        provider: { type: string, enum: [stripe, mpesa, airtel] }
        provider_ref: { type: string, description: Mobile-money checkout reference (STK push sent) }
        status: { type: string, enum: [processing, succeeded, failed, requires_action, refunded] }
        idempotency_key: { type: string }
        reused: { type: boolean }
    GivingScheduleCreate:
      type: object
      required: [fund, amount_minor, currency, frequency]
      properties:
        fund: { type: string }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        frequency: { type: string, enum: [weekly, monthly] }
        method: { type: string, enum: [card, mpesa, airtel], default: card }
        idempotency_key: { type: string, minLength: 8, maxLength: 255 }
    GivingRecord:
      type: object
      required: [transaction_id, amount_minor, currency, status]
      properties:
        transaction_id: { type: string, format: uuid }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        status: { type: string }
        fund: { type: [string, "null"] }
        receipt_code: { type: [string, "null"], description: M-Pesa confirmation code from the customer's SMS (e.g. UG3J29U3OL); null for older or non-mobile-money gifts }
        created_at: { type: string, format: date-time }
        settled_at: { type: [string, "null"], format: date-time }

    GivingDetail:
      type: object
      required: [transaction_id, amount_minor, currency, status, ledger]
      properties:
        transaction_id: { type: string, format: uuid }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        status: { type: string }
        fund: { type: [string, "null"] }
        method: { type: string }
        provider_ref: { type: [string, "null"] }
        receipt_code: { type: [string, "null"], description: M-Pesa confirmation code from the customer's SMS (e.g. UG3J29U3OL); null for older or non-mobile-money gifts }
        schedule_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        settled_at: { type: [string, "null"], format: date-time }
        ledger:
          type: array
          items:
            type: object
            required: [side, account, amount_minor, currency]
            properties:
              side: { type: string }
              account: { type: string }
              amount_minor: { type: integer, format: int64 }
              currency: { type: string }

    QuizSubmission:
      type: object
      required: [client_mutation_id, answers]
      properties:
        client_mutation_id: { type: string, format: uuid }
        answers:
          type: array
          items:
            type: object
            required: [question_id, given_answer]
            properties:
              question_id: { type: string, format: uuid }
              given_answer: { type: string }

    QuizResult:
      type: object
      required: [attempt_id, score_achieved, is_passed, pass_mark]
      properties:
        attempt_id: { type: string }
        score_achieved: { type: number }
        is_passed: { type: boolean }
        pass_mark: { type: number }
        unlocked_next_module_id: { type: [string, "null"] }
        requires_manual_review:
          type: boolean
          description: True when the attempt contains manual items (paragraph / keyless short_answer) needing human review. These are excluded from auto pass/fail.
        duplicate: { type: boolean, description: True when a replayed client_mutation_id returned the prior attempt }
    QuizAssembly:
      type: object
      required: [module_id, question_count, questions]
      properties:
        module_id: { type: string, format: uuid }
        question_count: { type: integer }
        time_limit_sec:
          type: [integer, "null"]
          description: Server-enforced time limit; the clock starts at assembly. Null = no limit.
        attempts_remaining:
          type: [integer, "null"]
          description: Attempts left under the module's cap (server-counted). Null = unlimited.
        questions:
          type: array
          items:
            type: object
            required: [question_id, q_type, question_text]
            properties:
              question_id: { type: string, format: uuid }
              q_type:
                type: string
                enum: [MultipleChoice, TrueFalse, FillInTheBlank, multiple_choice, checkbox, dropdown, short_answer, paragraph, linear_scale]
              question_text: { type: string }
              answer_options:
                description: >-
                  Legacy rows: a JSON string array. New rows: an object with
                  `choices` ({id,text,is_correct}[]) for choice types and/or
                  `scale` ({min,max,min_label,max_label}) for linear_scale.
                  Null for free-text (short_answer/paragraph). Correct flags are
                  NEVER leaked at assembly (server strips them).
                type: [array, object, "null"]
    ExamAssembly:
      type: object
      required: [level_number, question_count, questions]
      properties:
        level_number: { type: integer }
        question_count: { type: integer }
        questions:
          type: array
          items:
            type: object
            required: [question_id, q_type, question_text]
            properties:
              question_id: { type: string, format: uuid }
              q_type:
                type: string
                enum: [MultipleChoice, TrueFalse, FillInTheBlank, multiple_choice, checkbox, dropdown, short_answer, paragraph, linear_scale]
              question_text: { type: string }
              answer_options:
                description: See QuizAssembly.answer_options. Correct flags stripped at assembly.
                type: [array, object, "null"]
    ExamResult:
      type: object
      required: [exam_attempt_id, score_achieved, is_passed, pass_mark]
      properties:
        exam_attempt_id: { type: string, format: uuid }
        score_achieved: { type: number }
        is_passed: { type: boolean }
        pass_mark: { type: number }
        requires_manual_review:
          type: boolean
          description: True when the exam contains manual items (paragraph / keyless short_answer) needing human review. Excluded from auto pass/fail.
        duplicate: { type: boolean }
    ThreadCreate:
      type: object
      required: [thread_id, title, body]
      properties:
        thread_id: { type: string, format: uuid, description: Client-generated (offline-first) }
        title: { type: string, minLength: 3, maxLength: 200 }
        body: { type: string, maxLength: 20000, description: Markdown }
        client_mutation_id: { type: string, format: uuid }
    CommentCreate:
      type: object
      required: [comment_id, body]
      properties:
        comment_id: { type: string, format: uuid, description: Client-generated (offline-first) }
        body: { type: string, maxLength: 10000 }
        client_mutation_id: { type: string, format: uuid }
    GiftsSubmission:
      type: object
      required: [client_mutation_id, set_id, answers]
      properties:
        client_mutation_id: { type: string, format: uuid }
        set_id: { type: string, format: uuid, description: The served question-set this submission answers (scored over its subset). }
        answers:
          type: array
          minItems: 1
          items:
            type: object
            required: [question_id, value]
            properties:
              question_id: { type: string, format: uuid }
              value: { type: integer, minimum: 1, maximum: 5, description: Likert 1 (rarely) … 5 (strongly agree) }
    PrayerUpsert:
      type: object
      required: [entry_id, body]
      properties:
        entry_id: { type: string, format: uuid, description: Client-generated (offline-first) }
        title: { type: [string, "null"], maxLength: 200 }
        body: { type: string, maxLength: 10000 }
        is_answered: { type: boolean, default: false }
        answered_note: { type: [string, "null"], maxLength: 2000 }
        updated_at: { type: string, format: date-time, description: LWW anchor — stale replays are no-ops }
        client_mutation_id: { type: string, format: uuid }
    VerseSave:
      type: object
      required: [saved_verse_id, reference]
      properties:
        saved_verse_id: { type: string, format: uuid, description: Client-generated (offline-first) }
        reference: { type: string, maxLength: 80 }
        version: { type: string, maxLength: 12, default: KJV }
        verse_text: { type: [string, "null"], maxLength: 2000 }
        note: { type: [string, "null"], maxLength: 2000 }
        client_mutation_id: { type: string, format: uuid }
    AnnouncementCompose:
      type: object
      required: [title, body, channels, audience]
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        body: { type: string, description: Markdown, maxLength: 20000 }
        channels:
          type: array
          minItems: 1
          items: { type: string, enum: [push, email, sms, whatsapp, banner] }
        audience:
          oneOf:
            - type: object
              required: [kind]
              properties: { kind: { type: string, enum: [all] } }
            - type: object
              required: [kind, cell_group_ids]
              properties:
                kind: { type: string, enum: [cells] }
                cell_group_ids: { type: array, minItems: 1, items: { type: string, format: uuid } }
            - type: object
              required: [kind, level_number]
              properties:
                kind: { type: string, enum: [level] }
                level_number: { type: integer, minimum: 1 }
        scheduled_at: { type: string, format: date-time, description: Omit to keep as draft until /send }
        banner_expires_at: { type: string, format: date-time }
    ReflectionSubmit:
      type: object
      required: [reflection_text]
      properties:
        reflection_text: { type: string, minLength: 20, maxLength: 5000 }
    ReflectionReview:
      type: object
      required: [review_id, state, level_number]
      properties:
        review_id: { type: string, format: uuid }
        state: { type: string, enum: [pending, approved, rejected] }
        level_number: { type: integer }
    ReviewQueueItem:
      type: object
      required: [review_id, user_id, level_number, reflection_text, submitted_at]
      properties:
        review_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        full_name: { type: string }
        level_number: { type: integer }
        reflection_text: { type: string }
        cell_group_id: { type: [string, "null"], format: uuid }
        submitted_at: { type: string, format: date-time }
    ReviewDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        feedback_notes: { type: string, maxLength: 2000 }
    ReviewDecisionResult:
      type: object
      required: [review_id, state, leveled_up]
      properties:
        review_id: { type: string, format: uuid }
        state: { type: string, enum: [approved, rejected] }
        leveled_up: { type: boolean }

    # --- Offline sync (§3.6) ---
    SyncPullRequest:
      type: object
      properties:
        device_id: { type: string, format: uuid }
        cursors:
          type: object
          additionalProperties: { type: integer }
          description: Per-domain last-seen change_id
    SyncPullResponse:
      type: object
      required: [changes, tombstones, cursors]
      properties:
        changes:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              required: [op, row]
              properties:
                op: { type: string, enum: [upsert] }
                row: { type: object, additionalProperties: true }
        tombstones:
          type: object
          additionalProperties: { type: array, items: { type: string, format: uuid } }
        cursors:
          type: object
          additionalProperties: { type: integer }
    SyncPushRequest:
      type: object
      required: [mutations]
      properties:
        device_id: { type: string, format: uuid }
        mutations:
          type: array
          maxItems: 500
          items:
            type: object
            required: [mutation_id, seq, domain, op]
            properties:
              mutation_id: { type: string, format: uuid }
              seq: { type: integer }
              domain: { type: string }
              op: { type: string }
              payload: { type: object, additionalProperties: true }
    SyncPushResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [mutation_id, status]
            properties:
              mutation_id: { type: string, format: uuid }
              status: { type: string, enum: [applied, duplicate, rejected] }
              code: { type: string }
              detail: { type: string }

    # --- Engagement (§1.8) ---
    EngagementBreakdown:
      type: object
      required: [user_id, h_score, c_score, a_score, e_score, band]
      properties:
        user_id: { type: string, format: uuid }
        full_name: { type: string }
        h_score: { type: number, description: Habits (0–1) }
        c_score: { type: number, description: Curriculum (0–1) }
        a_score: { type: number, description: Attendance (0–1) }
        e_score: { type: number, description: Composite Eᵢ (0–1) }
        band: { type: string, enum: [thriving, steady, watch, at_risk] }
        last_active_days_ago: { type: [integer, "null"] }
        window_end: { type: string, format: date }
        computed_at: { type: string, format: date-time }

    # --- Certificates (§5.5) ---
    Certificate:
      type: object
      required: [certificate_id, verification_code, issued_at]
      properties:
        certificate_id: { type: string, format: uuid }
        level_number: { type: [integer, "null"] }
        verification_code: { type: string }
        pdf_object_key: { type: string }
        issued_at: { type: string, format: date-time }
        download_url: { type: string }
    CertificateVerification:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        revoked: { type: boolean }
        recipient_name: { type: string }
        level_number: { type: [integer, "null"] }
        issued_at: { type: string, format: date-time }
        verification_code: { type: string }
        content_hash: { type: string, description: "SHA-256 over the issuance facts" }
    NotificationPreferences:
      type: object
      required: [push_enabled, email_enabled, sms_enabled]
      properties:
        push_enabled: { type: boolean }
        email_enabled: { type: boolean }
        sms_enabled: { type: boolean }
    PlanDayReflection:
      type: object
      required: [id, plan_id, day_number, body, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        plan_id: { type: string, format: uuid }
        day_number: { type: integer, minimum: 1 }
        body: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ChatConversationSummary:
      type: object
      required: [conversation_id, kind, title]
      properties:
        conversation_id: { type: string, format: uuid }
        kind: { type: string, enum: [dm, group, space] }
        is_public: { type: boolean }
        title: { type: [string, "null"], description: "For a DM, the peer's name" }
        avatar_url: { type: [string, "null"] }
        peer_user_id:
          type: [string, "null"]
          format: uuid
          description: "The other member's user id when kind = dm; null otherwise"
        topic: { type: [string, "null"] }
        category: { type: [string, "null"] }
        member_count: { type: integer }
        last_body: { type: [string, "null"] }
        last_type: { type: [string, "null"] }
        last_at: { type: [string, "null"], format: date-time }
        last_duration: { type: [integer, "null"] }
        last_author: { type: [string, "null"] }
        unread: { type: integer }
        message_count: { type: integer }
        reaction_count: { type: integer }
        signature: { type: string, description: "HMAC-SHA256 detached signature (§5.5 KMS stand-in)" }
