      tags: [announcements]
      summary: Admin. Compose an announcement (draft, or scheduled when scheduled_at is set).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementCompose" }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /admin/announcements/{id}:
    get:
      tags: [announcements]
      summary: Admin. Announcement detail with per-channel delivered/open stats.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Announcement + stats }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [announcements]
      summary: Admin. Edit a draft/scheduled announcement; 409 once sent or cancelled.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
