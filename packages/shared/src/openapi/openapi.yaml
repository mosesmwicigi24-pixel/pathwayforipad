    get:
      tags: [progress]
      summary: My reflection for a reading-plan day (null when I haven't written one).
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: dayNumber, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Reflection or null
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - { $ref: "#/components/schemas/PlanDayReflection" }
                      - { type: "null" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [progress]
      summary: Write my reflection for a reading-plan day. Upsert per (user, plan, day); idempotent per client_mutation_id (§2.1).
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: dayNumber, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
                client_mutation_id: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: The saved reflection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanDayReflection" }
        "400": { description: Validation failed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
