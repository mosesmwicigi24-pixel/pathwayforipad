      tags: [progress]
      summary: Save my notification channel toggles (all three required; upsert).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPreferences" }
      responses:
        "200":
          description: The saved preferences
