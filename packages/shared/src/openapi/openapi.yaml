      summary: Admin. List announcements with delivered/open counts.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, scheduled, sent, cancelled] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: Announcements }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
