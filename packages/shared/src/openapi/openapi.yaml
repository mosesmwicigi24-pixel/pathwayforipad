  /chat/people:
    get:
      tags: [progress]
      summary: DM directory — members I may message (same congregation, minor-safe; excludes self). Optional ?q name search. Each row carries public achievement flair — level + counts only, never private detail.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: People
          content:
            application/json:
              schema:
                type: object
                required: [people]
                properties:
                  people:
                    type: array
                    items:
                      type: object
                      required: [user_id, full_name, level, badge_count, badge_icons, cert_count]
                      properties:
                        user_id: { type: string, format: uuid }
                        full_name: { type: string }
                        role: { type: string }
                        avatar_url: { type: ["string", "null"] }
                        congregation:
                          type: ["string", "null"]
                          description: Present only for portal-staff (Admin/SuperAdmin) callers — global directory rows.
                        level:
                          type: integer
                          description: Pathway level (enrollments.current_level; 1 when not yet enrolled).
                        badge_count:
                          type: integer
                          description: Count of unrevoked badges. Public aggregate only.
                        badge_icons:
                          type: array
                          maxItems: 3
                          items: { type: string }
                          description: Icon strings (badges.icon_key) of the up-to-3 most recently awarded badges; empty when none carry an icon.
                        cert_count:
                          type: integer
                          description: Count of issued certificates. Public aggregate only.
        "401": { $ref: "#/components/responses/Unauthorized" }
  /chat/dms:
    post:
      tags: [progress]
      summary: Open (or fetch) a 1:1 DM with another member; minor-safe (D-M6); same congregation.
      responses:
        "201": { description: Conversation }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/broadcast:
    post:
      tags: [progress]
      summary: Staff broadcast (Instructor+) — deliver ONE message to every active member of the sender's congregation as an individual DM from the sender (no group room; replies return as normal 1:1 threads). Minors excluded (D-M6). Idempotent on client_mutation_id. May carry an image (msg_type=image + attachment_url uploaded via /chat/attachments/sign) — body is then the caption.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 20000, description: "The message text (the caption, for an image broadcast)." }
                msg_type: { type: string, enum: [text, image], default: text }
                attachment_url: { type: string, format: uri, maxLength: 2000, description: Cloudinary secure_url of the uploaded image (the caption travels in body). }
                client_mutation_id: { type: string, format: uuid, description: Replays with the same id are no-ops. }
      responses:
        "201":
          description: Delivery count
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: integer, description: Number of members the message was delivered to. }
                  duplicate: { type: boolean, description: True when a replayed client_mutation_id short-circuited. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /chat/cells/{id}/conversation:
